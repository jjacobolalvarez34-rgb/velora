# Se construye sobre la configuración por defecto de detekt (--build-upon-default-config).
# Solo se listan las diferencias.

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    # Los composables reciben estado + lambdas + modifier.
    ignoreAnnotated: ['Composable']
    # Con DI manual (ADR-004) los ViewModels reciben sus repositorios por constructor.
    constructorThreshold: 9
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']

naming:
  # Los nombres de archivo los fija ESTILO.md (Color.kt, Type.kt, Motion.kt…).
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  # Las cláusulas de guarda al inicio (`?: return`, `if (...) return`) no cuentan.
  ReturnCount:
    max: 2
    excludeGuardClauses: true
  MagicNumber:
    # Los tokens de diseño son, por definición, números con nombre.
    # Las ilustraciones del tutorial son proporciones de dibujo.
    excludes: ['**/core/designsystem/**', '**/OnboardingDemos.kt', '**/test/**', '**/androidTest/**', '**/*.kts']
    ignorePropertyDeclaration: true
    # Valores con nombre en un enum (p. ej. TextSize.Large(1.15f)).
    ignoreEnums: true
    ignoreAnnotated: ['Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false

potential-bugs:
  # Prohibido `!!` (REGLAS §1).
  UnsafeCallOnNullableType:
    active: true

# CI de cada PR (PROCEDIMIENTOS P-06).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Estilo y análisis estático
        run: ./gradlew ktlintCheck detekt lint

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Release (verifica R8)
        run: ./gradlew :app:assembleRelease

      - name: Tamaño del APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          size=$(stat -c %s "$apk")
          echo "### APK release: $((size / 1024)) KB (presupuesto: 8192 KB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Reportes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            **/build/reports/
          retention-days: 7
